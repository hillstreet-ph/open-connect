<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Open Connect</title>
  <desc id="desc">A compact scorpion connector symbol</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172238"/>
      <stop offset="1" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="signal" x1="14" y1="50" x2="50" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4FF"/>
      <stop offset="1" stop-color="#3578FF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#surface)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" fill="none" stroke="#5DDCFF" stroke-opacity=".24" stroke-width="1.5"/>

  <!-- Tail: an open path that points back toward the connector core. -->
  <path d="M31.5 20.5c0-7.2 5.1-12 11.7-12 5.8 0 10.1 3.9 10.1 9.2 0 4.4-2.7 7.5-6.4 9.7" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
  <path d="m43.7 25.2 5.7.1-2.8 5" fill="none" stroke="#67E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central body, deliberately bold so it remains legible at 16–32px. -->
  <path d="M32 20.5 42.5 27v12L32 45.5 21.5 39V27L32 20.5Z" fill="#0B1220" stroke="url(#signal)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="28.5" cy="32.5" r="1.8" fill="#DBF8FF"/>
  <circle cx="35.5" cy="32.5" r="1.8" fill="#DBF8FF"/>

  <!-- Mirrored claws double as two halves of a plug connection. -->
  <path d="M22 31.5H14.5c-3.5 0-6 2.7-6 6.1 0 4.5 4.7 7.7 9 5.9l4.9-2.1" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
  <path d="m10.5 48 6.2-4.8 2.7 6.5" fill="none" stroke="#67E5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 31.5h7.5c3.5 0 6 2.7 6 6.1 0 4.5-4.7 7.7-9 5.9l-4.9-2.1" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
  <path d="m53.5 48-6.2-4.8-2.7 6.5" fill="none" stroke="#67E5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M28 51.5h8" stroke="#67E5FF" stroke-width="3" stroke-linecap="round"/>
</svg>

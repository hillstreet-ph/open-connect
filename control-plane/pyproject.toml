[project]
name = "open-connect-control"
version = "0.1.0"
description = "Authenticated capability broker for Open-Connect AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
e2b = ["e2b>=2,<3", "e2b-desktop>=2,<3"]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

name: Fixer — force Cloudflare redeploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why redeploy"
        required: false
        default: "manual heal"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OPEN_CONNECT_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Empty commit to trigger Pages
        run: |
          git config user.name "open-connect-bot"
          git config user.email "bot@open-connect.site"
          git commit --allow-empty -m "chore(deploy): force redeploy — ${{ github.event.inputs.reason }}"
          git push origin main

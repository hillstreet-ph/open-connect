name: Autonomous CI failure triage
on:
  workflow_run:
    workflows: ["CI — Validator"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report failed jobs without exposing log contents
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const failed = jobs.filter(j => j.conclusion === 'failure');
            const title = '[CI triage] ' + run.name + ' failed on ' + run.head_branch;
            const marker = '<!-- ci-run:' + run.id + ' -->';
            const body = [
              marker, 'Automated diagnosis requested. No code changes or approvals performed.',
              'Run: ' + run.html_url, 'Commit: ' + run.head_sha,
              'Failed jobs:', ...failed.map(j => '- ' + j.name + ': ' + j.html_url),
              'Next: inspect first failing step, reproduce, and propose a minimal fix PR.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (issues.some(i => (i.body || '').includes(marker))) return;
            await github.rest.issues.create({...context.repo, title, body});

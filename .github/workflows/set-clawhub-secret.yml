name: Set ClawHub secret

on:
  workflow_dispatch:
    inputs:
      secret_value:
        description: Value to store in the CLAWHUB_TOKEN repository secret.
        required: true
        type: string

permissions:
  contents: read
  secrets: write

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set repository secret
        env:
          GH_TOKEN: ${{ github.token }}
          VALUE: ${{ inputs.secret_value }}
        run: |
          printf '%s' "$VALUE" | gh secret set CLAWHUB_TOKEN --repo hillstreet-ph/open-connect
          gh secret list --repo hillstreet-ph/open-connect

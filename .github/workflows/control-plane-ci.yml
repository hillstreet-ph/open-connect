name: Control Plane CI
on:
  pull_request:
    paths:
      [
        "control-plane/**",
        "supabase/migrations/**",
        "supabase/tests/**",
        ".github/workflows/control-plane-ci.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "control-plane/**",
        "supabase/migrations/**",
        "supabase/tests/**",
        ".github/workflows/control-plane-ci.yml",
      ]
permissions:
  contents: read
jobs:
  key-access:
    name: Owned key access boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise grants, audit, idempotency and negative authorization
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/key_access_fixture.sql \
            -f supabase/migrations/20261010030000_owned_key_access.sql \
            -f supabase/tests/owned_key_access.sql
      - name: Exercise duplicate credential values and owner boundaries
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/credential_value_fixture.sql \
            -f supabase/migrations/20260923090000_credential_totp.sql \
            -f supabase/migrations/20260924010000_password_manager_credentials.sql \
            -f supabase/migrations/20261010050000_reusable_credential_values.sql \
            -f supabase/tests/reusable_credential_values.sql
      - name: Exercise organization policy helper grants and membership boundaries
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/organization_policy_fixture.sql \
            -f supabase/migrations/20261010094318_restore_organization_policy_grants.sql \
            -f supabase/tests/organization_policy_grants.sql \
            -f supabase/migrations/20261010094318_restore_organization_policy_grants.sql \
            -f supabase/tests/organization_policy_grants.sql
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[test]"
      - run: pytest -q
      - run: python -m compileall app
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@v7
        with:
          context: control-plane
          push: false
          tags: open-connect-control:ci

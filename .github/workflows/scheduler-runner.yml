name: Open-Connect background schedules

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: open-connect-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a scoped GitHub OIDC token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=open-connect-scheduler")
          token=$(jq -er '.value' <<< "$response")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run due Open-Connect schedules
        env:
          SCHEDULER_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 240 \
            -X POST \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            -H "Content-Type: application/json" \
            https://open-connect.site/api/internal/scheduler

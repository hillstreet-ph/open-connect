name: Databricks — Open-Connect data sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: databricks-open-connect-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync governed data
        env:
          DATABRICKS_SYNC_SECRET: ${{ secrets.DATABRICKS_SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_SYNC_SECRET:-}" ]; then
            echo "Databricks sync is not activated; repository secret is absent."
            exit 0
          fi
          response_file=$(mktemp)
          code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${DATABRICKS_SYNC_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"bootstrap":true}' \
            https://open-connect.site/api/v1/databricks)
          test "$code" = "200"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!p.ok)process.exit(1);console.log(JSON.stringify({ok:p.ok,memoryRecords:p.memoryRecords,knowledgeItems:p.knowledgeItems,resources:p.resources}))' "$response_file"

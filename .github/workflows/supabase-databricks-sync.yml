name: Supabase — Databricks sync

# One-shot sync of governed Supabase data into Databricks, hourly. The full
# 135-table pass takes about 35 minutes on a hosted runner.
# The concurrency group prevents overlapping runs when a sync takes longer
# than the schedule interval.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: supabase-databricks-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Supabase data to Databricks
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore sync watermark state
        uses: actions/cache@v6
        with:
          path: .sync_state
          key: supabase-sync-state-${{ github.run_id }}
          restore-keys: supabase-sync-state-

      - name: Run one-shot sync
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: python3 scripts/supabase_databricks_sync.py --once --registry config/supabase/table_registry.json --state .sync_state/sync_state.json --max-pages 400

      - name: Write sync audit back to Supabase
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: python3 scripts/supabase_writeback.py --mode audit --state .sync_state/sync_state.json --env-file /dev/null


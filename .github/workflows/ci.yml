name: CI — Validator

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: |
          bun install --frozen-lockfile
          npm ci --prefix services/playwright-worker --ignore-scripts --no-audit --no-fund
      - name: Dependency security audit
        run: bun audit
      - name: Lint
        run: bun run lint
      - name: Unit and navigation tests
        run: bun run test
      - name: OAuth database regression tests
        run: bun run test:oauth:db
      - name: Workforce database regression tests
        run: bun run test:workforce:db
      - name: Login activity database regression tests
        run: bun run test:login:db
      - name: Consolidated resource integrity
        run: python3 scripts/consolidate_resources.py
      - name: Marketplace branch history regression tests
        run: python3 scripts/update-marketplace-branch.test.py
      - name: Production health contract tests
        run: python3 scripts/validate_production_health_test.py
      - name: AI Factory roster smoke contract tests
        # Offline: exercises the roster smoke test's markers, SPA-shell
        # detection and retry policy against stubs. No network, so it can
        # never make this required check flaky.
        run: python3 scripts/validate_ai_factory_roster_test.py
      - name: Deploy verification gate contract tests
        # Offline: pins the post-merge gate's failure paths — a stale commit, a
        # missing /build-info.json, a wrong agent count, a missing MCP tool.
        # The gate must go red when production does not match main; a gate that
        # only ever passes is the bug this change exists to fix.
        run: python3 -m unittest discover -s scripts -p 'verify_production_deploy_test.py' -v
      - name: Strict TypeScript validation
        run: bun run typecheck
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          VITE_APP_URL: https://open-connect.site
        run: bun run build
      - name: AI Factory portable export contract tests
        # Runs after the build because it inspects the generated export set:
        # 103 agents x 5 formats, seven fields present, and no export inventing
        # callable tools the agent does not have.
        run: python3 scripts/validate_ai_factory_exports_test.py
      - name: AI Factory MCP endpoint contract tests
        # The endpoint reads exports through the ASSETS binding on Pages, but
        # this project deploys as a Worker where that binding is absent. These
        # tests pin the HTTP fallback so /ai-factory/mcp cannot regress to
        # -32603 "Static asset binding is unavailable" in production.
        run: node --experimental-strip-types --test src/lib/ai-factory-mcp.test.ts
      - name: OpenClaw marketplace portable exports
        # Regenerates the marketplace export bundle and verifies the build
        # just shipped it: one entry per cataloged resource, metadata-only
        # policy intact, every export present in the built Pages output.
        run: python3 scripts/generate_openclaw_exports.py --verify-build
      - name: Render SSR pages
        env:
          VITE_SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_APP_URL: https://open-connect.site
        run: bun run test:ssr
      - name: Workforce browser interaction fixture
        run: bun run test:workforce:browser
      - name: Upload Cloudflare Pages artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ github.sha }}
          path: .output/public
          retention-days: 7

  publish-required-build-status:
    name: Publish required build status
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the protected-branch status from the CI result
        uses: actions/github-script@v9
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const state = process.env.VALIDATION_RESULT === 'success' ? 'success' : 'failure';
            // Bind every published status to immutable SHAs from this validated event.
            // A branch or PR may advance while the validator is running.
            const shas = [context.sha];
            if (context.payload.pull_request) {
              shas.push(context.payload.pull_request.head.sha);
            }
            for (const sha of new Set(shas)) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'Build & validate',
                description: state === 'success'
                  ? 'Lint, tests, build, and SSR validation passed.'
                  : 'Validation job concluded as ' + process.env.VALIDATION_RESULT + '.',
              });
            }

  roster-smoke:
    name: AI Factory roster smoke (live)
    # Runs on every pull request and after every merge to main. Deliberately a
    # separate job from `validate`: the required "Build & validate" status is
    # published from `needs.validate.result`, so a brief production outage can
    # never turn that required check red. The script itself retries transient
    # failures (connection errors, timeouts, 5xx, 429) with exponential backoff
    # and only fails on a real, reproducible regression.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Roster pages, assets and legacy .html URLs
        # On a pull request this probes PRODUCTION, which by definition does not
        # yet serve the exports this PR adds — so the export URLs are skipped
        # here and covered instead by the offline contract test in `validate`,
        # which inspects the built export set. After merge to main the exports
        # are live, so the full check (pages + every export URL) runs there.
        run: |
          python3 scripts/validate_ai_factory_roster.py \
            --base-url https://open-connect.site \
            --attempts 5 \
            --timeout 20 \
            --backoff 3 \
            ${{ github.event_name == 'pull_request' && '--skip-exports' || '' }}

  smoke-production:
    name: Production smoke (post-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Cloudflare Pages
        run: sleep 90
      - name: Health
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://open-connect.site/api/v1/health || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              python3 scripts/validate_production_health.py /tmp/health.json
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed"
          exit 1
      - name: OAuth discovery
        run: |
          set -e
          curl -sS https://open-connect.site/.well-known/oauth-authorization-server | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert 'S256' in d.get('code_challenge_methods_supported',[])
          assert d.get('authorization_endpoint')
          print('oauth ok')
          "
      - name: Public pages
        run: |
          set -e
          for p in / /auth /models /resources /connections /explore; do
            read -r code effective_url <<< "$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{http_code} %{url_effective}' "https://open-connect.site$p")"
            echo "$p -> $effective_url $code"
            test "$code" = "200"
          done
      - name: AI Factory roster pages
        # The roster is static HTML, not an SPA route, and has regressed twice
        # (exact-path 404s, then a 308/307 canonicalization loop). Assert each
        # page's own HTML, not just its status code.
        run: |
          python3 scripts/validate_ai_factory_roster.py \
            --base-url https://open-connect.site \
            --attempts 5 \
            --timeout 20 \
            --backoff 3

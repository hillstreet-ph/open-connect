name: CI — Validator

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit and navigation tests
        run: bun run test
      - name: Marketplace branch history regression tests
        run: python3 scripts/update-marketplace-branch.test.py
      - name: Production health contract tests
        run: python3 scripts/validate_production_health_test.py
      - name: Strict TypeScript validation
        run: bun run typecheck
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          VITE_APP_URL: https://open-connect.site
        run: bun run build
      - name: Render SSR pages
        env:
          VITE_SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_APP_URL: https://open-connect.site
        run: bun run test:ssr
      - name: Upload Cloudflare Pages artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ github.sha }}
          path: .output/public
          retention-days: 7

  publish-required-build-status:
    name: Publish required build status
    if: always() && github.event_name == 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the protected-branch status from the CI result
        uses: actions/github-script@v9
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const state = process.env.VALIDATION_RESULT === 'success' ? 'success' : 'failure';
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const shas = new Set([
              context.payload.pull_request.head.sha,
              pullRequest.merge_commit_sha,
            ].filter(Boolean));
            for (const sha of shas) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'Build & validate',
                description: state === 'success'
                  ? 'Lint, tests, build, and SSR validation passed.'
                  : `Validation job concluded as ${process.env.VALIDATION_RESULT}.`,
              });
            }

  smoke-production:
    name: Production smoke (post-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Cloudflare Pages
        run: sleep 90
      - name: Health
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://open-connect.site/api/v1/health || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              python3 scripts/validate_production_health.py /tmp/health.json
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed"
          exit 1
      - name: OAuth discovery
        run: |
          set -e
          curl -sS https://open-connect.site/.well-known/oauth-authorization-server | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert 'S256' in d.get('code_challenge_methods_supported',[])
          assert d.get('authorization_endpoint')
          print('oauth ok')
          "
      - name: Public pages
        run: |
          set -e
          for p in / /auth /models /resources /connections /explore; do
            read -r code effective_url <<< "$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{http_code} %{url_effective}' "https://open-connect.site$p")"
            echo "$p -> $effective_url $code"
            test "$code" = "200"
          done

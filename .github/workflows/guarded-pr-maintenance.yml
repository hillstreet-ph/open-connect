name: Guarded PR maintenance
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Report exact duplicate heads
        uses: actions/github-script@v9
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {...context.repo, state:'open', per_page:100});
            const groups = new Map();
            for (const pr of prs) {
              const key = pr.base.ref + ':' + pr.head.sha;
              groups.set(key, [...(groups.get(key) || []), pr.number]);
            }
            core.summary.addHeading('Exact duplicate pull-request heads');
            for (const ids of groups.values()) if (ids.length > 1) core.summary.addRaw(ids.map(n=>'#'+n).join(', ')+'\n');
            await core.summary.write();
  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for patch-only Dependabot updates
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.match(/^Bump .+ from (\d+)\.(\d+)\.(\d+) to (\d+)\.(\d+)\.(\d+)$/i);
            if (!title || title[1] !== title[4] || title[2] !== title[5] || Number(title[6]) <= Number(title[3])) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number:pr.number, per_page:100});
            if (!files.length || files.length > 10 || files.some(f=> !/(^|\/)(package\.json|package-lock\.json|bun\.lock|pnpm-lock\.yaml|yarn\.lock)$/.test(f.filename))) return;
            const id = pr.node_id;
            await github.graphql(`mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){clientMutationId}}`, {id});

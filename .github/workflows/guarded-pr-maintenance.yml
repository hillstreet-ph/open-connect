name: Guarded PR maintenance
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  triage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Detect matching open pull requests (report only)
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 });
            const groups = new Map();
            for (const pr of prs) {
              if (pr.draft) continue;
              const key = [pr.base.ref, pr.head.sha].join(':');
              groups.set(key, [...(groups.get(key) || []), pr]);
            }
            const matches = [...groups.values()].filter(g => g.length > 1);
            core.summary.addHeading('Potential duplicate pull requests');
            if (!matches.length) core.summary.addRaw('No exact base/head SHA duplicates found.\n');
            for (const group of matches) core.summary.addRaw(group.map(pr => '#' + pr.number).join(', ') + '\n');
            await core.summary.write();
  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable GitHub-native auto-merge for Dependabot patches only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr view "$PR_URL" --json title --jq '.title' | grep -Eiq '^bump .+ from [0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\.[0-9]+\.[0-9]+' || exit 0
          gh pr view "$PR_URL" --json title --jq '.title' | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const m=s.match(/from (\\d+)\\.(\\d+)\\.(\\d+) to (\\d+)\\.(\\d+)\\.(\\d+)/);process.exit(m&&m[1]===m[4]&&m[2]===m[5]&&Number(m[6])>Number(m[3])?0:1)})' || exit 0
          gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -Eq '(^|/)(package-lock.json|bun.lock|pnpm-lock.yaml|yarn.lock)
          gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -Ev '(^|/)(package.json|package-lock.json|bun.lock|pnpm-lock.yaml|yarn.lock)$' && exit 0 || true
          gh pr merge --auto --squash "$PR_URL"
 || exit 0
          gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -Ev '(^|/)(package.json|package-lock.json|bun.lock|pnpm-lock.yaml|yarn.lock)$' && exit 0 || true
          gh pr merge --auto --squash "$PR_URL"

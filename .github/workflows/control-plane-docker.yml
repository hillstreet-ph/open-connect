# Installed from deploy/docker-workflows/open-connect-docker.yml.
name: Control Plane Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-docker.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-docker.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: hillstreet/open-connect

jobs:
  build:
    if: github.repository == 'hillstreet-ph/open-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./control-plane
          file: ./control-plane/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=cp-docker
          cache-to: ${{ (github.event_name != 'pull_request') && 'type=gha,mode=max,scope=cp-docker' || '' }}
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name oc-test -p 8080:8080 \
            -e OC_PUBLIC_BASE_URL=https://open-connect.site \
            -e OC_OIDC_ISSUER=https://open-connect.site \
            "${{ env.IMAGE_NAME }}:test"
          trap 'docker stop oc-test >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs oc-test
          exit 1

  publish:
    if: >-
      github.repository == 'hillstreet-ph/open-connect'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'release'
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    needs: [build]
    runs-on: ubuntu-latest
    environment: container-publish
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: test -n "$DOCKERHUB_TOKEN" && test -n "$DOCKERHUB_USERNAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            MAJOR=$(echo "$TAG" | sed -E 's/^v?([0-9]+).*/v\1/')
            MINOR=$(echo "$TAG" | sed -E 's/^v?([0-9]+\.[0-9]+).*/v\1/')
            echo "tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:${MINOR},${IMAGE_NAME}:${MAJOR},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:main-${SHA7},${IMAGE_NAME}:main,${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./control-plane
          file: ./control-plane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/hillstreet-ph/open-connect
          cache-from: type=gha,scope=cp-docker
          cache-to: type=gha,mode=max,scope=cp-docker

name: Consolidated resource integrity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/consolidate_resources.py
      - scripts/consolidate_resources_test.py
      - scripts/resource-migration-requirements.txt
      - config/resource-migration.*.json
      - resources/migrated/**
      - .github/workflows/v1-resource-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned parser test dependencies
        run: python3 -m pip install -r scripts/resource-migration-requirements.txt
      - name: Test hostile archives, SQL data parsing, and PDF actions
        run: python3 scripts/consolidate_resources_test.py
      - name: Verify all canonical artifacts without source repositories
        run: python3 scripts/consolidate_resources.py
      - uses: actions/upload-artifact@v7
        with:
          name: canonical-resource-migration-evidence
          path: config/resource-migration.lock.json
          retention-days: 90

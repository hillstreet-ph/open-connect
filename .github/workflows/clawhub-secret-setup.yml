name: ClawHub secret setup

on:
  workflow_dispatch:
    inputs:
      token:
        description: ClawHub API token to store as the CLAWHUB_TOKEN repository secret
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Store CLAWHUB_TOKEN repository secret
        env:
          GH_TOKEN: ${{ github.token }}
          CLAWHUB_TOKEN_VALUE: ${{ inputs.token }}
        run: |
          gh secret set CLAWHUB_TOKEN --repo "hillstreet-ph/open-connect" --body "$CLAWHUB_TOKEN_VALUE"
          echo "secret stored"
          gh secret list --repo "hillstreet-ph/open-connect" --json name --jq '.[].name'

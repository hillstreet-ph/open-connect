# Push server-only runtime bindings from GitHub Actions secrets into the Cloudflare Pages
# production environment (open-connect-app), then redeploy so the Worker picks them up.
#
# GitHub is the single place secret values are entered; nothing is printed or committed.
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   scope: Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  account that owns the Pages project
#   DATABRICKS_TOKEN, DATABRICKS_SYNC_SECRET, DATABRICKS_PSEUDONYMIZATION_KEY
# Non-secret values (host, warehouse, catalog, schema) live in this file.
name: Cloudflare runtime secrets

on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: Redeploy production after updating the bindings
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-runtime-secrets
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: open-connect-app
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_SYNC_SECRET: ${{ secrets.DATABRICKS_SYNC_SECRET }}
      DATABRICKS_PSEUDONYMIZATION_KEY: ${{ secrets.DATABRICKS_PSEUDONYMIZATION_KEY }}
      DATABRICKS_HOST: https://dbc-13d27355-a99e.cloud.databricks.com
      DATABRICKS_WAREHOUSE_ID: dae787fe16c17482
      DATABRICKS_CATALOG: open_connect
      DATABRICKS_SCHEMA: production
    steps:
      - name: Check required secrets are present
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABRICKS_TOKEN DATABRICKS_SYNC_SECRET DATABRICKS_PSEUDONYMIZATION_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - name: Update Pages production environment
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/body.json
          import json, os
          secret = ["DATABRICKS_TOKEN", "DATABRICKS_SYNC_SECRET", "DATABRICKS_PSEUDONYMIZATION_KEY"]
          plain = ["DATABRICKS_HOST", "DATABRICKS_WAREHOUSE_ID", "DATABRICKS_CATALOG", "DATABRICKS_SCHEMA"]
          env = {n: {"type": "secret_text", "value": os.environ[n].strip()} for n in secret}
          env.update({n: {"type": "plain_text", "value": os.environ[n]} for n in plain})
          print(json.dumps({"deployment_configs": {"production": {"env_vars": env}}}))
          PY
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
            --data @/tmp/body.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")
          rm -f /tmp/body.json
          if [ "$code" != "200" ]; then
            echo "::error title=Cloudflare update failed::HTTP $code"
            python3 -c "import json;print([e.get('message') for e in json.load(open('/tmp/resp.json')).get('errors',[])])" || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          env = json.load(open("/tmp/resp.json"))["result"]["deployment_configs"]["production"]["env_vars"]
          print("bindings present:", sorted(k for k in env if k.startswith("DATABRICKS_")))
          PY
          rm -f /tmp/resp.json

      - name: Redeploy production
        if: inputs.redeploy
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          id=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/deployments?env=production&per_page=1" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['result'][0]['id'])")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/deployments/${id}/retry")
          [ "$code" = "200" ] || { echo "::error title=Redeploy failed::HTTP $code"; exit 1; }

      - name: Verify runtime reports Databricks configured
        if: inputs.redeploy
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS https://open-connect.site/api/v1/databricks | grep -q '"configured":true'; then
              echo "open-connect reports Databricks configured"; exit 0
            fi
            sleep 15
          done
          echo "::error title=Not configured::open-connect.site still reports configured=false after redeploy"
          exit 1

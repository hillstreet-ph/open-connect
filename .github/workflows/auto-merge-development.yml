name: Merger — development to main

on:
  workflow_run:
    workflows: ["CI — Validator"]
    types: [completed]
    branches: [development]
  workflow_dispatch:
    inputs:
      force:
        description: "Create PR even if checks pending"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  checks: read

# Policy: open/update promotion PR only.
# Do NOT auto-merge to main — branch protection requires "Build & validate".
# Human or explicit merge after required checks.

jobs:
  promote:
    name: Open promotion PR
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development')
    runs-on: ubuntu-latest
    env:
      OPEN_CONNECT_GITHUB_APP_ID: ${{ secrets.OPEN_CONNECT_GITHUB_APP_ID }}
      OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        if: env.OPEN_CONNECT_GITHUB_APP_ID != '' && env.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY != ''
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OPEN_CONNECT_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Ensure development exists
        run: |
          git fetch origin development:development 2>/dev/null || git branch development origin/main
          git push origin development 2>/dev/null || true

      - name: Create or update promotion PR (no auto-merge)
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const base = 'main';
            const head = 'development';
            const title = 'chore: promote development → main';
            const body = [
              '## Promotion PR',
              '',
              'Automated open from `development` after CI — Validator succeeds.',
              '',
              '**Does not auto-merge.** Merge only after required check **Build & validate** is green.',
              '',
              '- Prefer squash merge',
              '- See docs/audits/ci-workflow-diff.md',
            ].join('\n');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base
            });
            let pr = prs[0];
            if (!pr) {
              try {
                const { data } = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  head,
                  base,
                  body
                });
                pr = data;
                core.info(`Created PR #${pr.number}`);
              } catch (e) {
                core.warning(String(e));
                return;
              }
            } else {
              core.info(`Existing PR #${pr.number}`);
              try {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body
                });
              } catch (e) {
                core.warning('Could not update PR body: ' + e.message);
              }
            }

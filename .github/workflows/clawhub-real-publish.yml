name: ClawHub real publish

on:
  workflow_dispatch:
    inputs:
      clawhub_token:
        description: ClawHub token used for this run only.
        required: true
        type: string
      owner:
        description: ClawHub owner/publisher handle.
        required: false
        type: string
        default: hillstreet-ph
      categories:
        description: Comma-separated ClawHub category slugs.
        required: false
        type: string
        default: integrations,automation,operations
      topics:
        description: Comma-separated ClawHub topics.
        required: false
        type: string
        default: open-connect,workspace,agentic

jobs:
  publish-first-party:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      root: skills
      dry_run: false
      owner: ${{ inputs.owner }}
      categories: ${{ inputs.categories }}
      topics: ${{ inputs.topics }}
    secrets:
      clawhub_token: ${{ inputs.clawhub_token }}

  publish-vendor-root:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      root: skills/vendor
      dry_run: false
      owner: ${{ inputs.owner }}
      categories: ${{ inputs.categories }}
      topics: ${{ inputs.topics }}
    secrets:
      clawhub_token: ${{ inputs.clawhub_token }}

  publish-vendor-openclaw-skills:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      root: skills/vendor/openclaw/skills
      dry_run: false
      owner: ${{ inputs.owner }}
      categories: ${{ inputs.categories }}
      topics: ${{ inputs.topics }}
    secrets:
      clawhub_token: ${{ inputs.clawhub_token }}

  publish-vendor-openclaw-agents:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      root: skills/vendor/openclaw/agents
      dry_run: false
      owner: ${{ inputs.owner }}
      categories: ${{ inputs.categories }}
      topics: ${{ inputs.topics }}
    secrets:
      clawhub_token: ${{ inputs.clawhub_token }}

name: Debug errors
on: push
permissions: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint errors
        continue-on-error: true
        run: |
          bun run lint 2>&1 | grep '  error  ' > lint-errors.txt || true
          cat lint-errors.txt
      - name: Type errors
        continue-on-error: true
        run: |
          bun run typecheck 2>&1 | grep 'error TS' > type-errors.txt || true
          cat type-errors.txt
      - name: Annotate
        if: always()
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error title=lint::$line"
          done < lint-errors.txt
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error title=type::$line"
          done < type-errors.txt

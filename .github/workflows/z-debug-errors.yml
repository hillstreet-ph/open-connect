name: z-debug-errors
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        continue-on-error: true
      - name: lint
        run: |
          bun run lint 2>&1 | tee /tmp/lint.log || true
          grep '  error  ' /tmp/lint.log | while IFS= read -r line; do echo "::error title=lint::$line"; done
        continue-on-error: true
      - name: typecheck
        run: |
          bun run typecheck 2>&1 | tee /tmp/tc.log || true
          grep 'error TS' /tmp/tc.log | while IFS= read -r line; do echo "::error title=type::$line"; done
        continue-on-error: true
      - name: tests
        run: |
          bun run test 2>&1 | tee /tmp/test.log | tail -400 || true
          grep -E '(^not ok|✖|FAIL [0-9]|AssertionError|test failure|tests [0-9]+|suites [0-9]+|pass [0-9]+|fail [0-9]+)' /tmp/test.log | head -40 | while IFS= read -r line; do echo "::error title=test::$line"; done
        continue-on-error: true

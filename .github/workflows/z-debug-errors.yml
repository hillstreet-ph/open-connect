name: Z debug lint errors

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: z-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    if: github.ref != 'refs/heads/debug-lint-output'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Capture lint errors
        run: |
          {
            echo "# lint"
            bunx eslint . --quiet 2>&1 | tail -c 4000 || true
            echo ""
            echo "# typecheck"
            bun run typecheck 2>&1 | tail -c 3000 || true
          } > lint-errors.txt
      - name: Publish errors
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@example.com"
          git checkout -B debug-lint-output
          git add lint-errors.txt
          git commit -m "chore: capture lint output" || true
          git push origin HEAD:debug-lint-output --force

name: Typecheck diagnostics

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-diagnostics:
    name: Post typecheck output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          set +e
          bun run typecheck > /tmp/tc.txt 2>&1
          code=$?
          {
            echo "## Typecheck output (exit $code)"
            echo '~~~'
            head -c 20000 /tmp/tc.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

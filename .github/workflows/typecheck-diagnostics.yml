name: Typecheck diagnostics

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck-diagnostics:
    name: Post typecheck output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          set +e
          bun run typecheck > /tmp/tc.txt 2>&1
          echo "exit_code=$?" >> /tmp/tc.txt
          exit 0
      - name: Commit output to diagnostics branch
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('/tmp/tc.txt', 'utf8').slice(0, 60000);
            const branch = 'typecheck-output';
            const path = 'typecheck.txt';
            let sha;
            try {
              const f = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
              sha = f.data.sha;
            } catch (e) {
              try {
                const base = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
                await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'refs/heads/' + branch, sha: base.data.object.sha });
              } catch (e2) {}
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'typecheck output',
              content: Buffer.from(content).toString('base64'),
              sha,
            });

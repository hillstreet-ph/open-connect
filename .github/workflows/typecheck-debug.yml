name: Typecheck debug

on:
  push:
    branches: ["feat/sidebar-resize"]

jobs:
  typecheck-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install quietly
        run: bun install --frozen-lockfile > /dev/null 2>&1
      - name: Report typecheck errors only
        continue-on-error: true
        run: |
          bun run typecheck 2>&1 | grep -E "error TS" | head -25 > /tmp/errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            echo "::error title=ts$n::$line"
          done < /tmp/errors.txt
          if [ "$n" -eq 0 ]; then echo "::error title=ts::NO ERRORS FOUND"; fi

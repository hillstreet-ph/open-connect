name: Typecheck debug
on:
  push:
    branches: [feat/connectors-identity-ux]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/544/merge
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: |
          bun install --frozen-lockfile
          npm ci --prefix services/playwright-worker --ignore-scripts --no-audit --no-fund
      - run: bun run lint || true
      - run: bun run test > test-out.txt 2>&1 || true
      - run: tail -5 test-out.txt || true
      - run: bun run test:oauth:db > oauth-out.txt 2>&1 || true
      - run: bun run test:workforce:db > wf-out.txt 2>&1 || true
      - run: python3 scripts/consolidate_resources.py || true
      - run: python3 scripts/update-marketplace-branch.test.py || true
      - run: python3 scripts/validate_production_health_test.py || true
      - run: bun run typecheck > tc-out.txt 2>&1 || true
      - run: cat tc-out.txt
      - run: |
          grep -nE "error" tc-out.txt | head -40 > tc-ann.txt || true
          tail -5 tc-out.txt >> tc-ann.txt || true
          git status --porcelain >> tc-ann.txt || true
          nl -ba tc-ann.txt
          while IFS= read -r line; do
            echo "::error::${line}"
          done < tc-ann.txt

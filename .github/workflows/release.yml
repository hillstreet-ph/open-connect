name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Open-Connect $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          PRE="${{ github.event.inputs.prerelease }}"
          NOTES="CHANGELOG.md"
          if command -v gh >/dev/null; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists"
            else
              ARGS=(release create "$TAG" --title "Open-Connect $TAG" --notes-file "$NOTES")
              if [ "$PRE" = "true" ]; then ARGS+=(--prerelease); fi
              gh "${ARGS[@]}" || gh release create "$TAG" --title "Open-Connect $TAG" --generate-notes ${PRE:+--prerelease}
            fi
          else
            echo "gh CLI missing"
            exit 1
          fi

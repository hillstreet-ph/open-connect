name: Lint diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: |
          bun install --frozen-lockfile
          npm ci --prefix services/playwright-worker --ignore-scripts --no-audit --no-fund
      - name: Run all validator steps with captured exit codes
        run: |
          set +e
          : > diag-output.txt
          run_step() {
            name="$1"
            shift
            echo "=== STEP: $name ===" >> diag-output.txt
            "$@" > /tmp/step.txt 2>&1
            code=$?
            echo "--- exit=$code" >> diag-output.txt
            tail -n 80 /tmp/step.txt >> diag-output.txt
            echo "" >> diag-output.txt
          }
          run_step audit bun audit
          run_step test-oauth-db bun run test:oauth:db
          run_step test-workforce-db bun run test:workforce:db
          run_step test-login-db bun run test:login:db
          run_step consolidate-resources python3 scripts/consolidate_resources.py
          run_step marketplace-branch-tests python3 scripts/update-marketplace-branch.test.py
          run_step production-health-tests python3 scripts/validate_production_health_test.py
          run_step roster-smoke-tests python3 scripts/validate_ai_factory_roster_test.py
          export VITE_SUPABASE_URL=https://huadtiuuoiriqrjpjxhr.supabase.co
          export VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder
          export VITE_APP_URL=https://open-connect.site
          run_step build bun run build
          run_step test-ssr bun run test:ssr
          run_step test-workforce-browser bun run test:workforce:browser
          echo "=== DONE ===" >> diag-output.txt
          exit 0
      - name: Publish diagnostics output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('diag-output.txt', 'utf8');
            const branch = 'lint-output';
            const path = 'diag-output.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branch,
                path,
              });
              sha = existing.data.sha;
            } catch (error) {
              sha = null;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              path,
              message: 'Update lint diagnostics output',
              content: Buffer.from(content).toString('base64'),
              sha,
            });

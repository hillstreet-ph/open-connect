name: Lint diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint . --format json > eslint.json || true
      - run: bun audit > audit.txt 2>&1 || true
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('eslint.json', 'utf8'));
            const lines = [];
            for (const file of report) {
              for (const msg of file.messages) {
                if (msg.severity === 2) {
                  lines.push(file.filePath.replace(process.env.GITHUB_WORKSPACE + '/', '') + ':' + msg.line + ':' + msg.column + ' ' + msg.ruleId + ' ' + msg.message);
                }
              }
            }
            let audit = '';
            try { audit = fs.readFileSync('audit.txt', 'utf8').slice(0, 40000); } catch (e) { audit = String(e); }
            const content = (lines.join('\n') || 'LINT CLEAN') + '\n===AUDIT===\n' + audit;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'refs/heads/lint-output';
            const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({ owner, repo, tree: [{ path: 'eslint-errors.txt', mode: '100644', type: 'blob', sha: blob.data.sha }] });
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'lint diagnostics', tree: tree.data.sha, parents: [] });
            try { await github.rest.git.createRef({ owner, repo, ref, sha: commit.data.sha }); }
            catch (e) { await github.rest.git.updateRef({ owner, repo, ref: 'heads/lint-output', sha: commit.data.sha, force: true }); }

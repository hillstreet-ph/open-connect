name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: false
        type: string
        default: ''
      job_id:
        required: false
        type: string
        default: ''
      cancel_run:
        required: false
        type: string
        default: ''

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump job log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: hillstreet-ph/open-connect
          RUN_ID: ${{ inputs.run_id }}
          JOB_ID: ${{ inputs.job_id }}
          CANCEL_RUN: ${{ inputs.cancel_run }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          {
            if [ -n "$CANCEL_RUN" ]; then
              echo "=== cancelling run $CANCEL_RUN ==="
              gh api -X POST "repos/$REPO/actions/runs/$CANCEL_RUN/cancel"
              echo "cancel exit: $?"
              sleep 60
            fi
            if [ -n "$JOB_ID" ]; then
              echo "=== logs for job $JOB_ID ==="
              curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/jobs/$JOB_ID/logs"
              echo "curl exit: $?"
            fi
            if [ -n "$RUN_ID" ]; then
              echo "=== jobs for run $RUN_ID ==="
              gh api "repos/$REPO/actions/runs/$RUN_ID/jobs"
            fi
          } > diag-output.txt 2>&1
          if ! gh api "repos/$REPO/git/ref/heads/lint-output" > /dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/lint-output" -f sha="$SHA" > /dev/null
          fi
          sha=$(gh api "repos/$REPO/contents/diag-output.txt?ref=lint-output" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$REPO/contents/diag-output.txt" -f message="diag update" -f content="$(base64 -w0 diag-output.txt)" -f branch="lint-output" -f sha="$sha" > /dev/null || true
          else
            gh api -X PUT "repos/$REPO/contents/diag-output.txt" -f message="diag create" -f content="$(base64 -w0 diag-output.txt)" -f branch="lint-output" > /dev/null || true
          fi

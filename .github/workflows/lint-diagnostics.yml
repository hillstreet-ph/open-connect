name: Lint diagnostics
on:
  push:
    branches: ["feat/studio-collapse-lists"]
permissions:
  contents: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Lint
        run: |
          set +e
          bunx eslint . > lint-output.txt 2>&1
          echo "lint_exit=$?" >> lint-output.txt
          exit 0
      - name: Push output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('lint-output.txt', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'lint-output.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'lint-output',
              });
              sha = existing.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Lint diagnostics output',
              content: Buffer.from(content).toString('base64'),
              branch: 'lint-output',
              sha,
            });

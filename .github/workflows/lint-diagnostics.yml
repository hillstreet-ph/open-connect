name: Lint diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit > tsc.txt || true
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let content = '';
            try { content = fs.readFileSync('tsc.txt', 'utf8').slice(0, 50000); } catch (e) { content = String(e); }
            if (!content.trim()) content = 'CLEAN';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'refs/heads/lint-output';
            const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({ owner, repo, tree: [{ path: 'tsc-errors.txt', mode: '100644', type: 'blob', sha: blob.data.sha }] });
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'tsc diagnostics', tree: tree.data.sha, parents: [] });
            try { await github.rest.git.createRef({ owner, repo, ref, sha: commit.data.sha }); }
            catch (e) { await github.rest.git.updateRef({ owner, repo, ref: 'heads/lint-output', sha: commit.data.sha, force: true }); }

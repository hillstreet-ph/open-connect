name: Lint diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run lint, typecheck, and tests
        run: |
          set +e
          bun run lint > diag-output.txt 2>&1
          echo "lint_exit=$?" >> diag-output.txt
          bun run typecheck >> diag-output.txt 2>&1
          echo "typecheck_exit=$?" >> diag-output.txt
          bun run test >> diag-output.txt 2>&1
          echo "test_exit=$?" >> diag-output.txt
          exit 0
      - name: Publish diagnostics output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('diag-output.txt', 'utf8');
            const branch = 'lint-output';
            const path = 'diag-output.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branch,
                path,
              });
              sha = existing.data.sha;
            } catch (error) {
              sha = null;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              path,
              message: 'Update lint diagnostics output',
              content: Buffer.from(content).toString('base64'),
              sha,
            });

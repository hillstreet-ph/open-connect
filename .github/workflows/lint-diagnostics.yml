name: Lint diagnostics

on:
  push:
    branches: [feat/import-detect-all]

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run lint and typecheck
        run: |
          set +e
          bun run lint > diag-output.txt 2>&1
          echo "lint_exit=$?" >> diag-output.txt
          echo "" >> diag-output.txt
          bun run typecheck >> diag-output.txt 2>&1
          echo "typecheck_exit=$?" >> diag-output.txt
          exit 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('diag-output.txt', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'lint-output';
            const path = 'diag-output.txt';
            let sha = null;
            try {
              const res = await github.rest.repos.getContent({ owner, repo, ref: 'heads/' + branch, path });
              sha = res.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              branch,
              path,
              message: 'Update lint diagnostics output',
              content: Buffer.from(content).toString('base64'),
              sha,
            });

name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id whose annotations should be dumped
        required: false
        type: string
        default: ''

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: hillstreet-ph/open-connect
          RUN_ID: ${{ inputs.run_id }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "=== annotations for run $RUN_ID ==="
            gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/annotations" || echo "annotations call failed"
            echo "=== jobs for run $RUN_ID ==="
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" || echo "jobs call failed"
            echo "=== check run annotations ==="
            cs=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .check_suite_id)
            for cr in $(gh api "repos/$REPO/check-suites/$cs/check-runs" --jq '.[].id'); do
              echo "--- check run $cr ---"
              gh api "repos/$REPO/check-runs/$cr/annotations" || echo "cr annotations failed"
            done
            echo "=== run attempt detail ==="
            gh api "repos/$REPO/actions/runs/$RUN_ID" || echo "run call failed"
          } > diag-output.txt 2>&1
          if ! gh api "repos/$REPO/git/ref/heads/lint-output" > /dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/lint-output" -f sha="$SHA" > /dev/null
          fi
          sha=$(gh api "repos/$REPO/contents/diag-output.txt?ref=lint-output" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$REPO/contents/diag-output.txt" -f message="diag update" -f content="$(base64 -w0 diag-output.txt)" -f branch="lint-output" -f sha="$sha" > /dev/null
          else
            gh api -X PUT "repos/$REPO/contents/diag-output.txt" -f message="diag create" -f content="$(base64 -w0 diag-output.txt)" -f branch="lint-output" > /dev/null
          fi

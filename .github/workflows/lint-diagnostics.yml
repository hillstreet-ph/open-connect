name: Lint diagnostics
on:
  push:
    branches-ignore:
      - lint-output
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture lint output
        run: |
          set +e
          bun run lint > lint-output.txt 2>&1
          echo "lint_exit=$?" >> lint-output.txt
          exit 0
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('lint-output.txt', 'utf8');
            const blob = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content,
              encoding: 'utf-8',
            });
            const tree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree: [{ path: 'lint-output.txt', mode: '100644', type: 'blob', sha: blob.data.sha }],
            });
            const commit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'lint diagnostics',
              tree: tree.data.sha,
            });
            const ref = 'refs/heads/lint-output';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: commit.data.sha,
              });
            } catch (error) {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/lint-output',
                sha: commit.data.sha,
                force: true,
              });
            }

name: Lint diagnostics

on:
  push:
    branches:
      - feat/import-skills-sh

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          set +e
          bun run lint > diag-output.txt 2>&1
          echo "lint_exit=$?" >> diag-output.txt
          echo "" >> diag-output.txt
          bun run typecheck >> diag-output.txt 2>&1
          echo "typecheck_exit=$?" >> diag-output.txt
          exit 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const content = fs.readFileSync("diag-output.txt", "utf8");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: "diag-output.txt", ref: "lint-output" });
              sha = existing.data.sha;
            } catch (e) {
              sha = null;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "diag-output.txt",
              message: "Update lint diagnostics",
              content: Buffer.from(content).toString("base64"),
              branch: "lint-output",
              sha,
            });

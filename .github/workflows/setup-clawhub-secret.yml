name: Setup ClawHub secret

on:
  workflow_dispatch:

permissions:
  contents: write
  secrets: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLAWHUB_TOKEN_VALUE: clh_z54K7knjrg5EtvJuk_Zf48WPJYrlUDXKa8Qj-Cb4w2Q
    steps:
      - name: Set repository secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CLAWHUB_TOKEN_VALUE" | gh secret set CLAWHUB_TOKEN --repo hillstreet-ph/open-connect
          gh secret list --repo hillstreet-ph/open-connect --json name,updatedAt > secret-status.txt
          cat secret-status.txt
      - name: Publish status file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/hillstreet-ph/open-connect/contents/secret-status.txt?ref=feat/clawhub-secret-setup" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/hillstreet-ph/open-connect/contents/secret-status.txt" -f message="secret status update" -f content="$(base64 -w0 secret-status.txt)" -f branch="feat/clawhub-secret-setup" -f sha="$sha" > /dev/null
          else
            gh api -X PUT "repos/hillstreet-ph/open-connect/contents/secret-status.txt" -f message="secret status create" -f content="$(base64 -w0 secret-status.txt)" -f branch="feat/clawhub-secret-setup" > /dev/null
          fi
      - name: Delete this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh api -X DELETE "repos/hillstreet-ph/open-connect/git/refs/heads/feat/clawhub-secret-setup" || echo "branch delete deferred"

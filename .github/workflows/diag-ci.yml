name: Diagnose CI

on:
  push:
    branches: [feat/open-auto-gateway-route]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Collect diagnostics
        run: |
          {
            echo "### Lint"
            bun run lint 2>&1 | tail -80
            echo "### Typecheck"
            bunx tsc --noEmit 2>&1 | tail -80
            echo "### Tests"
            bun run test 2>&1 | tail -120
          } > diag-output.txt
          echo "--- end ---" >> diag-output.txt
      - name: Commit diagnostics
        run: |
          git config user.name "open-connect-autofixer[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add diag-output.txt
          git commit -m "chore(ci): record diagnostics output (temporary)" || echo "nothing to commit"
          git push

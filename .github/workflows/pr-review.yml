name: PR — Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, development]

jobs:
  review:
    name: Automated review checklist
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      OPEN_CONNECT_GITHUB_APP_ID: ${{ secrets.OPEN_CONNECT_GITHUB_APP_ID }}
      OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        if: env.OPEN_CONNECT_GITHUB_APP_ID != '' && env.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OPEN_CONNECT_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPEN_CONNECT_GITHUB_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Changed files summary
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "### Changed files" > /tmp/review.md
          git diff --name-status "$BASE"..."$HEAD" >> /tmp/review.md || true
          echo "" >> /tmp/review.md
          echo "### Guardrails" >> /tmp/review.md
          if git diff --name-only "$BASE"..."$HEAD" | grep -E '\.env$|credentials|secret' ; then
            echo "- ⚠️ Possible secrets in diff — do not merge until reviewed" >> /tmp/review.md
            echo "secrets_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "- ✅ No obvious secret filenames in diff" >> /tmp/review.md
            echo "secrets_risk=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE"..."$HEAD" | grep -E 'src/routes/well-known/' ; then
            echo "- ⚠️ well-known routes under src/routes can break TanStack build — prefer src/server.ts" >> /tmp/review.md
          fi
          echo "- CI must pass before merge to main" >> /tmp/review.md
          echo "- Prefer squash merge; keep main deployable" >> /tmp/review.md

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Automated reviewer\n\n' + body
            });

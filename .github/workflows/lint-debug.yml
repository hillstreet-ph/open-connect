name: Lint debug
on:
  push:
    branches: [feat/connectors-plugin-style-ui]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint > lint-out.txt 2>&1 || true
      - run: cat lint-out.txt
      - run: |
          grep -nE "error" lint-out.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

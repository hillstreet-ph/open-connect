name: Lint debug

on:
  pull_request:
    branches: [main]

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run lint and capture output
        run: |
          set +e
          bun run lint > /tmp/lint.txt 2>&1
          code=$?
          echo "lint exit=$code"
          head -c 60000 /tmp/lint.txt
          exit 0
      - name: Report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/lint.txt', 'utf8');
            const safe = out.slice(0, 60000).replaceAll('`', 'ˋ');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Lint output:
```
' + safe + '
```',
            });

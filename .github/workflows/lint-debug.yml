name: Lint debug
on:
  push:
    branches: [feat/connectors-identity-ux]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint > lint-out.txt 2>&1 || true
      - run: cat lint-out.txt
      - run: |
          grep -nE "error|✖" lint-out.txt | head -50 || true
          while IFS= read -r line; do
            echo "::error::${line}"
          done < <(grep -nE "  [0-9]+:[0-9]+  error" lint-out.txt | head -50 || true)

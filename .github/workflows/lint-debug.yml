name: Lint debug

on:
  push:
    branches: ["feat/sidebar-resize", "main"]

jobs:
  lint-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install quietly
        run: bun install --frozen-lockfile > /dev/null 2>&1
      - name: Report lint errors only
        continue-on-error: true
        run: |
          bun run lint 2>&1 | grep -E "  error  " | head -25 > /tmp/errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            echo "::error title=lint$n::$line"
          done < /tmp/errors.txt
          if [ "$n" -eq 0 ]; then echo "::error title=lint::NO ERRORS FOUND"; fi

name: Lint debug

on:
  push:
    branches: ["feat/sidebar-resize", "main"]

jobs:
  lint-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install quietly
        run: bun install --frozen-lockfile > /dev/null 2>&1
      - name: Print lint errors
        continue-on-error: true
        run: |
          bun run lint 2>&1 | grep -E "(error|warning)" | head -40 | while IFS= read -r line; do
            echo "::error::${line//:/ ::}"
          done

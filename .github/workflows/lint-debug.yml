name: Lint debug

on:
  push:
    branches: [feat/connectors-apps-information]
  workflow_dispatch:

jobs:
  lint-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: |
          set +e
          bun run lint > /tmp/lint.txt 2>&1
          echo "lint exit code: $?" >> /tmp/lint.txt
          exit 0
      - name: Post lint output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --rawfile out /tmp/lint.txt --arg SHA "$GITHUB_SHA" '{body: ("Lint output for commit " + $SHA + ":\n" + $out)}' > /tmp/payload.json
          gh api "repos/${{ github.repository }}/issues/560/comments" --input /tmp/payload.json

name: Lint debug
on:
  push:
    branches: [feat/connectors-identity-ux]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint > lint-out.txt 2>&1 || true
      - run: cat lint-out.txt
      - run: |
          grep -nE "error|✖|Problem|fatal|OOM|memory|Cannot|ELIFECYCLE" lint-out.txt | head -12 > lint-ann.txt || true
          tail -6 lint-out.txt >> lint-ann.txt || true
          nl -ba lint-ann.txt
          while IFS= read -r line; do
            echo "::error::${line}"
          done < lint-ann.txt

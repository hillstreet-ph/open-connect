name: Lint debug

on:
  pull_request:
    branches: [main]

jobs:
  lint-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and report errors
        run: |
          set +e
          out=$(bun run lint 2>&1)
          code=$?
          echo "$out" | tail -80
          if [ "$code" -ne 0 ]; then
            echo "$out" | grep -E "  [0-9]+:[0-9]+  error|Parsing error|error " | head -10 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-220)
              echo "::error::$msg"
            done
            exit 1
          fi

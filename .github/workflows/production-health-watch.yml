name: Production health watch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify health contract
        id: health
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 https://open-connect.site/api/v1/health -o /tmp/health.json && python3 scripts/validate_production_health.py /tmp/health.json; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Open or update outage issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- open-connect-production-health -->';
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const existing = issues.find(i=>(i.body||'').includes(marker));
            const body = [marker,'Production health validation failed.','Workflow: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,'Investigate deployment, provider status and logs before rollback. No automatic rollback without a verified release target.'].join('\n');
            if (existing) await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({...context.repo,title:'Production health validation failure',body});

name: Hourly marketplace collector

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-connect-marketplace-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover and deduplicate metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/collect-marketplace-resources.mjs
      - name: Publish review candidates
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types scripts/collect-marketplace-resources.mjs --publish
      - name: Upload redacted discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-candidates-${{ github.run_id }}
          path: audit-results/marketplace
          retention-days: 14

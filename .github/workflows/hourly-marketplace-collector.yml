name: Marketplace catalog sync

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: open-connect-marketplace-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover, validate, and deduplicate metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/collect-marketplace-resources.mjs --write-catalog
      - name: Validate generated catalog
        run: npm run test:registry && npm run marketplace:validate
      - name: Publish reviewed candidates to Supabase
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: https://huadtiuuoiriqrjpjxhr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types scripts/collect-marketplace-resources.mjs --publish
      - name: Create or update catalog review pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- config/marketplace-candidates.generated.json)" ]; then
            echo "Catalog is current."
            exit 0
          fi
          branch="automation/marketplace-catalog-sync"
          git config user.name "open-connect-marketplace[bot]"
          git config user.email "open-connect-marketplace[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add config/marketplace-candidates.generated.json
          git commit -m "chore(marketplace): refresh reviewed source candidates"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(marketplace): refresh source candidates" \
            --body "Automated metadata-only catalog refresh. Every candidate remains non-installable until license and security review are complete."
      - name: Upload redacted discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-candidates-${{ github.run_id }}
          path: audit-results/marketplace
          retention-days: 14

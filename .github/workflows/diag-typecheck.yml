name: Diagnose typecheck
on:
  push:
    branches: [feat/cloudflare-ai-platform-fallback]
permissions:
  contents: read
  pull-requests: write
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck and capture
        id: tc
        run: |
          set +e
          bun run typecheck > /tmp/tc.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "typecheck exit: ${{ steps.tc.outputs.exit }}"
            echo 'markdown'
            tail -n 80 /tmp/tc.log
          } > /tmp/comment.md
          gh pr comment 739 --body-file /tmp/comment.md --repo "$GITHUB_REPOSITORY"

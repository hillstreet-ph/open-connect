name: TS diagnostics
on:
  push:
    branches: ["feat/studio-import-marketplace"]
permissions:
  contents: write
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Typecheck
        run: |
          set +e
          bunx tsc --noEmit > ts-output.txt 2>&1
          echo "tsc_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Push output
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('ts-output.txt', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'refs/heads/ts-output';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref });
            } catch (e) {}
            await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'ts-output.txt',
              message: 'TS diagnostics output',
              content: Buffer.from(content).toString('base64'),
              branch: 'ts-output',
            });

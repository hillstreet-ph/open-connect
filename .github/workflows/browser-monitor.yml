name: Browser Monitor
on:
  pull_request:
    paths: ["services/browser-monitor/**", ".github/workflows/browser-monitor.yml"]
  push:
    branches: [main]
    paths: ["services/browser-monitor/**", ".github/workflows/browser-monitor.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-monitor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/browser-monitor/requirements.txt
      - run: python -m unittest discover -s services/browser-monitor -v
      - run: python -m compileall -q services/browser-monitor
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: services/browser-monitor
          push: false
          load: true
          tags: open-connect-browser-monitor:ci
      - name: Verify non-root runtime and imports
        run: |
          test "$(docker inspect --format '{{.Config.User}}' open-connect-browser-monitor:ci)" = monitor
          docker run --rm --entrypoint python open-connect-browser-monitor:ci -c 'import core, source, delivery, worker'
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: container-publish
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: services/browser-monitor
          push: true
          tags: hillstreet/open-connect:browser-monitor-${{ github.sha }}
          provenance: true
          sbom: true

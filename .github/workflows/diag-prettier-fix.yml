name: Diag prettier fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Report and apply prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: |
          set +e
          bunx prettier --check src/styles.css src/routes/__root.tsx src/routes/_authenticated/campaign-studio.tsx src/routes/_authenticated/connections.tsx src/components/resource-url-import.tsx > /tmp/check.txt 2>&1
          code=$?
          cat /tmp/check.txt
          echo "prettier check exit $code"
          echo "prettier check exit $code" >> /tmp/check.txt
          exit 0
      - name: Comment check output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/check.txt
      - name: Write
        run: bunx prettier --write src/styles.css src/routes/__root.tsx src/routes/_authenticated/campaign-studio.tsx src/routes/_authenticated/connections.tsx src/components/resource-url-import.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no formatting changes"
            exit 0
          fi
          git commit -m "style: apply prettier formatting"
          git push

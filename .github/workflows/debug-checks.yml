name: Debug checks

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: read
      pull-requests: read
    steps:
      - name: Dump check data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=2b58bcfb4353b60e85f2782491feb797647be232
          {
            echo "## Check runs on HEAD"
            gh api "repos/hillstreet-ph/open-connect/commits/$HEAD/check-runs"
            echo "## Commit statuses"
            gh api "repos/hillstreet-ph/open-connect/commits/$HEAD/status"
            echo "## Check suites on HEAD"
            gh api "repos/hillstreet-ph/open-connect/commits/$HEAD/check-suites"
            echo "## PR 554 head and state"
            gh api repos/hillstreet-ph/open-connect/pulls/554 --jq '{head: .head.sha, mergeable: .mergeable, mergeable_state: .mergeable_state}'
          } > /tmp/out.txt 2>&1 || true
          gh api repos/hillstreet-ph/open-connect/issues/560/comments -f body="$(cat /tmp/out.txt)" || echo "comment failed"

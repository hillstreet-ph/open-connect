name: Diagnose lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    name: Diagnose lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### bun / eslint versions"
            bun --version
            bunx eslint --version
            echo "### bun run lint"
            echo '~~~'
            bun run lint 2>&1 || true
            echo '~~~'
            echo "### bunx eslint . (unix format)"
            echo '~~~'
            bunx eslint . --format unix 2>&1 || true
            echo '~~~'
            echo "### prettier check src"
            echo '~~~'
            bunx prettier --check "src/**/*.{ts,tsx,css}" 2>&1 || true
            echo '~~~'
          } > /tmp/diag.md
          gh pr comment "$PR" --body-file /tmp/diag.md --repo "$GITHUB_REPOSITORY"

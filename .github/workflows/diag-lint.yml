name: Diagnose lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diag:
    name: Diagnose lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Apply automatic fixes
        run: |
          bunx prettier --write "src/**/*.{ts,tsx,css}"
          bunx eslint src --fix --no-error-on-unmatched-pattern || true
      - name: Commit and push fixes
        run: |
          git config user.name "open-connect-autofixer[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No automatic fixes required."
            exit 0
          fi
          git commit -m "style: apply automatic formatting and lint fixes"
          git push
